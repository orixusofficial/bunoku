
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFEF9"/>
      <stop offset="100%" stop-color="#EDE8DA"/>
    </linearGradient>
    <radialGradient id="eye">
      <stop offset="0%" stop-color="#596052"/>
      <stop offset="100%" stop-color="#242D26"/>
    </radialGradient>
  </defs>

  <!-- Ears -->
  <ellipse cx="177" cy="116" rx="54" ry="112" transform="rotate(-13 177 116)" fill="url(#fur)" stroke="#DED8CA" stroke-width="5"/>
  <ellipse cx="335" cy="116" rx="54" ry="112" transform="rotate(13 335 116)" fill="url(#fur)" stroke="#DED8CA" stroke-width="5"/>
  <ellipse cx="180" cy="119" rx="29" ry="83" transform="rotate(-13 180 119)" fill="#E9BFC0"/>
  <ellipse cx="332" cy="119" rx="29" ry="83" transform="rotate(13 332 119)" fill="#E9BFC0"/>

  <!-- Face -->
  <ellipse cx="256" cy="300" rx="170" ry="155" fill="url(#fur)" stroke="#DED8CA" stroke-width="5"/>

  <!-- Cheeks -->
  <ellipse cx="151" cy="327" rx="30" ry="19" fill="#F2BFC0" opacity=".65"/>
  <ellipse cx="361" cy="327" rx="30" ry="19" fill="#F2BFC0" opacity=".65"/>

  <!-- Eyes -->
  <ellipse id="left-eye" cx="193" cy="278" rx="20" ry="27" fill="url(#eye)"/>
  <ellipse id="right-eye" cx="319" cy="278" rx="20" ry="27" fill="url(#eye)"/>

  <!-- Eye highlights -->
  <circle cx="199" cy="268" r="7" fill="white"/>
  <circle cx="325" cy="268" r="7" fill="white"/>
  <circle cx="187" cy="286" r="3.5" fill="white" opacity=".8"/>
  <circle cx="313" cy="286" r="3.5" fill="white" opacity=".8"/>

  <!-- Nose -->
  <path d="M244 319 Q256 310 268 319 Q256 338 244 319Z" fill="#DB929A"/>

  <!-- Mouth -->
  <path d="M256 337 Q246 352 233 345 M256 337 Q266 352 279 345" fill="none" stroke="#76675F" stroke-width="4" stroke-linecap="round"/>

  <!-- Tiny freckles -->
  <circle cx="174" cy="316" r="3" fill="#C69D91"/>
  <circle cx="184" cy="324" r="3" fill="#C69D91"/>
  <circle cx="338" cy="316" r="3" fill="#C69D91"/>
  <circle cx="328" cy="324" r="3" fill="#C69D91"/>
</svg>
